<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Lajuma Secondary School</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #172b4d;
    }

    header {
      background: #063b2c;
      color: white;
      text-align: center;
      padding: 24px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 440px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 6px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #b9c4ce;
      background: white;
    }

    button {
      margin-top: 22px;
      background: #08734e;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus, input:focus, select:focus {
      outline: 2px solid #08734e;
      outline-offset: 2px;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #536273;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>LAJUMA SECONDARY SCHOOL</h1>
    <p>Daura, Katsina State, Nigeria</p>
  </header>

  <main>
    <h2>Portal Login</h2>

    <form id="loginForm">

      <label for="accountType">Login as</label>

      <select id="accountType" required>
        <option value="student">Student</option>
        <option value="staff">School Staff</option>
      </select>

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        autocomplete="username"
        placeholder="Enter your registered email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">
        Log In
      </button>

      <p id="message" role="status" aria-live="polite"></p>

    </form>

    <p class="note">
      Students can access their published results after signing in.
      Staff access requires an authorized school account.
      Contact the school if you need help accessing your account.
    </p>
  </main>

  <footer>
    &copy; <span id="year"></span> Lajuma Secondary School, Daura
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    const SUPABASE_URL =
      "https://hhjfukdarhrmxdurqzeo.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_xGel2wLMMQqG8kJTIl-wTA_YZfoBOws";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const accountType =
        document.getElementById("accountType").value;

      message.textContent = "Signing in...";
      loginButton.disabled = true;

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent =
            "Login failed. Check your email and password.";
          return;
        }

        if (!data.user) {
          message.textContent =
            "Login failed. No authenticated user was returned.";
          return;
        }

        message.textContent =
          "Login successful! Opening your portal...";

        if (accountType === "student") {
          window.location.replace("results.html");
        } else {
          window.location.replace("admin.html");
        }

      } catch (error) {
        console.error("Login error:", error);

        message.textContent =
          "Something went wrong. Please try again.";
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>

</body>
</html>
